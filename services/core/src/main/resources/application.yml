spring:
  application:
    name: urbanpay-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urbanpay}
    username: ${DB_USER:urbanpay}
    password: ${DB_PASSWORD:urbanpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful
  # Confia no X-Forwarded-For apenas quando vem de proxies internos (BFF, gateway, rede do
  # cluster). Sem isso, todo mundo pareceria ter o IP do BFF e o rate limit por IP não serviria.
  forward-headers-strategy: native

urbanpay:
  security:
    jwt:
      issuer: ${JWT_ISSUER:urbanpay-core}
      audience: urbanpay
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # Janela em que um refresh token recém-rotacionado ainda é aceito (requisições paralelas
      # do mesmo navegador). Fora dela, reuso = roubo e a família inteira é revogada.
      refresh-reuse-grace: 30s
      # Chaves RSA em PEM (PKCS#8 / X.509). Se vazias, um par efêmero é gerado
      # na inicialização (apenas para desenvolvimento: tokens morrem a cada restart).
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    pin:
      max-attempts: 5
      lock-duration: 15m
    rate-limit:
      # Por IP: freia ataques de força bruta e de "credential stuffing" vindos de uma origem.
      login-per-ip-per-minute: 20
      register-per-ip-per-hour: 10
      # Por e-mail: freia ataques distribuídos (vários IPs) contra a mesma conta. Contamos só
      # falhas e não bloqueamos a conta de vez, para o atacante não conseguir trancar a vítima.
      login-failures-per-email: 5
      login-failure-window: 15m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO