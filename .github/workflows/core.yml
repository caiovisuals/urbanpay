name: core (Java)

on:
  push:
    paths: ["services/core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["services/core/**", ".github/workflows/core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers usa o Docker do runner para subir um Postgres real.
      - run: mvn -B verify
